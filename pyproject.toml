[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-service"
version = "1.0.0"
description = "Demo orders service used to showcase Frogbot scan-pull-request"
requires-python = ">=3.7"
dependencies = [
    "aiohttp==3.7.4",
    "cryptography==2.3",
    "urllib3==1.24.1",
]

[tool.setuptools]
packages = ["orders"]
